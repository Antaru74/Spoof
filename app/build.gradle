plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antaru.perappspoof'
    compileSdk 34

    defaultConfig {
        applicationId 'com.antaru.perappspoof'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    // Xposed API 82 (classic), dipakai LSPosed. compileOnly = tidak dibundel ke APK.
    if (file('libs/api-82.jar').exists()) {
        compileOnly files('libs/api-82.jar')
    } else {
        compileOnly 'de.robv.android.xposed:api:82'
    }
}

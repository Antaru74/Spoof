name: Build LSPosed module

on:
  workflow_dispatch:
  push:
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ambil Xposed API 82 (jar cadangan)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/api-82.jar \
            https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar \
            || echo "Unduh jar gagal, Gradle akan coba lewat Maven"
          [ -s app/libs/api-82.jar ] || rm -f app/libs/api-82.jar
          ls -l app/libs || true

      - name: Build APK (debug, sudah ditandatangani debug key)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Info APK
        run: |
          ls -l app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PerAppSpoof-debug-apk
          path: app/build/outputs/apk/debug/*.apk
